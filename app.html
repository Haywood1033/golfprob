const DK_MODES = { projection: { label: 'Projection', w: 0, tip: 'Mean DK points — cash games' }, balanced: { label: 'Balanced', w: 0.5, tip: 'Halfway between mean and 90th-percentile outcome' }, ceiling: { label: 'Ceiling', w: 1, tip: '90th-percentile outcome — large-field tournaments' } };
const dkKey = () => `golfprob-dk-${S.tour}-${S.data?.event.id}`;

function loadSalaryFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    const head = rows[0].map(h => h.trim().toLowerCase());
    const iName = head.indexOf('name'), iId = head.indexOf('id'), iSal = head.indexOf('salary'), iNameId = head.indexOf('name + id');
    if (iName < 0 || iSal < 0) { alert('This doesn’t look like a DraftKings salary file. It needs “Name” and “Salary” columns (DKSalaries.csv from the contest’s Export to CSV).'); return; }
    S.salaries = { fileName: file.name, raw: rows.slice(1).map(r => ({ name: r[iName], id: iId >= 0 ? r[iId] : '', nameId: iNameId >= 0 ? r[iNameId] : '', salary: Number(String(r[iSal]).replace(/[$,]/g, '')) })).filter(r => r.name && r.salary > 0) };
    resolveSalaries();
    try { localStorage.setItem(dkKey(), JSON.stringify({ fileName: S.salaries.fileName, raw: S.salaries.raw })); } catch { /* storage unavailable */ }
    S.dkResult = null;
    renderDfs();
  };
  reader.readAsText(file);
}
function resolveSalaries() {
  if (!S.salaries || !S.data) return;
  const match = buildMatcher(S.data.players);
  S.salaries.rows = S.salaries.raw.map(r => ({ ...r, player: match(r.name) }));
}

function dkPool() {
  if (!S.data) return [];
  const w = DK_MODES[S.dkMode].w;
  const bySal = new Map((S.salaries?.rows || []).filter(r => r.player).map(r => [r.player.id, r]));
  return S.data.players.filter(p => p.dk && p.status === 'ACTIVE').map(p => {
    const sal = bySal.get(p.id);
    return {
      id: p.id, name: p.name, dkId: sal?.id || '', salary: sal?.salary || 0, draw: p.draw,
      proj: p.dk.mean, ceil: p.dk.p90, floor: p.dk.p10, makeCut: p.odds?.makeCut, win: p.odds?.win,
      points: p.dk.mean + w * (p.dk.p90 - p.dk.mean),
    };
  });
}

function buildDfs() {
  const pool = dkPool().filter(p => p.salary && (S.dkDraw === 'all' || p.draw === S.dkDraw || S.dkLocks.has(p.id)));
  const opts = { count: S.dkCount, locks: [...S.dkLocks].filter(id => pool.some(p => p.id === id)), excludes: [...S.dkExcludes], maxExposure: S.dkCount > 1 && S.dkExposure < 1 ? S.dkExposure : 0, minUnique: S.dkCount > 1 ? S.dkUnique : 1, timeLimitMs: 45000 };
  const slim = pool.map(({ id, name, salary, points }) => ({ id, name, salary, points }));
  const t0 = performance.now(), mode = S.dkMode;
  S.dkBusy = true; S.dkProgress = { built: 0, count: S.dkCount }; S.dkResult = null; renderDfs();
  const finish = out => { S.dkBusy = false; S.dkProgress = null; S.dkResult = { ...out, mode, ms: performance.now() - t0 }; renderDfs(); };
  try {
    const worker = new Worker('/lib/dk-optimizer.js');
    worker.onmessage = e => {
      if (e.data.type === 'progress') { S.dkProgress = e.data; renderDfs(); }
      if (e.data.type === 'done') { worker.terminate(); finish(e.data); }
    };
    worker.onerror = () => { worker.terminate(); runInline(); };
    worker.postMessage({ pool: slim, opts });
  } catch { runInline(); }
  function runInline() {
    const go = () => finish(window.DKOpt.buildLineups(slim, opts));
    if (window.DKOpt) return setTimeout(go, 30);
    const sc = Object.assign(document.createElement('script'), { src: '/lib/dk-optimizer.js', onload: go, onerror: () => finish({ lineups: [], reason: 'Couldn’t load the optimizer script.' }) });
    document.head.appendChild(sc);
  }
}

function exportDfs() {
  const r = S.dkResult, pool = new Map(dkPool().map(p => [p.id, p]));
  const lines = ['G,G,G,G,G,G', ...r.lineups.map(l => l.players.map(p => pool.get(p.id)?.dkId || pool.get(p.id)?.name).join(','))];

}

        const wv = wx.waves[i];

          <div class="dname">${DOW(x.date)} · R${x.round}<span>${new Date(`${x.date}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' })}</span></div>
          <div class="dmain">${wxIcon(x.icon, 32)}<div class="temp">${Math.round(x.tempMax ?? 0)}°<small>/ ${Math.round(x.tempMin ?? 0)}°</small></div></div>
          <div class="drow"><span>${esc(x.cond)}</span></div>
          <div class="drow"><span>Wind</span><span>${Math.round(x.windMax ?? 0)} mph ${x.dirLabel}</span></div>
          <div class="drow"><span>Gusts</span><span>${Math.round(x.gustMax ?? 0)} mph</span></div>

          <div class="drow"><span>Easier wave</span><span>${wv && wv.am && wv.pm ? (Math.abs(wv.edge) < 0.25 ? 'Even' : `${wv.edge > 0 ? 'AM' : 'PM'} by ${Math.abs(wv.edge).toFixed(1)}`) : '—'}</span></div>
        </button>`;
      }).join('')}
    </div>

    <div class="wx-two" style="margin-bottom:16px">
      <div class="card chart-card">
        <div class="card-h"><h2>Wind · ${DOW(day.date)} R${day.round}</h2><span class="sub">Hourly, mph${wave?.fromSheet ? ' · wave tee times from the tee sheet' : ' · typical wave tee times'}</span></div>
        <div class="card-b"><div class="chart" id="windChart"></div>
          <div class="section-t" style="margin:14px 0 0">Direction (arrows point downwind)</div>

      <div class="card chart-card">
        <div class="card-h"><h2>Wind by wave</h2><span class="sub">${DOW(day.date)}</span></div>
        <div class="card-b"><div class="chart" id="compass"></div></div>
      </div>
    </div>

    <div class="grid-3" style="grid-template-columns:1fr 1fr;margin-bottom:16px">
      <div class="card chart-card"><div class="card-h"><h2>Chance of rain</h2><span class="sub">${DOW(day.date)}</span></div><div class="card-b"><div class="chart" id="rainChart"></div></div></div>
      <div class="card chart-card"><div class="card-h"><h2>Temperature</h2><span class="sub">${DOW(day.date)}, °F</span></div><div class="card-b"><div class="chart" id="tempChart"></div></div></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-h"><h2>Wave comparison</h2><span class="sub">Average over each wave’s ~5-hour round · positive gap = morning easier</span></div>
      <div class="table-wrap" style="border:0;border-radius:0 0 var(--r) var(--r)"><table class="data">
        <thead><tr><th class="l">Round</th><th class="l">Wave</th><th>Tee</th><th>Wind</th><th>Gusts</th><th class="l">From</th><th>Rain</th><th>Temp</th><th>Strokes vs other wave</th></tr></thead>
        <tbody>${wx.waves.map(wv => ['am', 'pm'].map((k, j) => {
          const st = wv[k];
          if (!st) return '';
          const gap = k === 'am' ? wv.edge : -wv.edge;
          return `<tr>
            ${j === 0 ? `<td class="l" rowspan="2"><div class="pname">R${wv.round}</div><div class="psub">${DOW(wv.date)}</div></td>` : ''}
            <td class="l">${k.toUpperCase()}${wv.fromSheet ? '' : ' <span class="muted">(typical)</span>'}</td>
            <td>${fmtHour(k === 'am' ? wv.amTee : wv.pmTee)}</td>
            <td>${Math.round(st.wind)} mph</td><td>${Math.round(st.gustMax)} mph</td>
            <td class="l">${st.dirLabel}</td>
            <td>${st.rainProbMax ? `${st.rainProbMax}%` : st.precip ? `${st.precip.toFixed(2)} in` : '0%'}</td>
            <td>${Math.round(st.tempLo)}–${Math.round(st.tempHi)}°</td>
            <td><span class="tag ${Math.abs(gap) < 0.25 ? '' : gap > 0 ? 'pos' : 'neg'}">${Math.abs(gap) < 0.25 ? 'Even' : `${gap > 0 ? 'Easier' : 'Harder'} ${Math.abs(gap).toFixed(1)}`}</span></td>
          </tr>`;
        }).join('')).join('')}</tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="card-h"><h2>Weather briefing</h2><span class="sub">Generated ${new Date(wx.generatedAt).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' })} from the numbers above</span></div>
      <div class="card-b brief">
        ${wu.sections.map(s => `<h3>${esc(s.title)}</h3>${s.title === 'How to use this' || s.title === 'Confidence & caveats' ? `<ul>${s.paragraphs.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : s.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}`).join('')}
      </div>
      <details class="more" style="border-top:1px solid var(--line)">
        <summary>Hourly table · ${DOW(day.date)}</summary>
        <div class="table-wrap" style="border:0;border-radius:0;border-top:1px solid var(--line)"><table class="data">
          <thead><tr><th class="l">Hour</th><th class="l">Conditions</th><th>Temp</th><th>Wind</th><th class="l">From</th><th>Gusts</th><th>Rain</th><th>Ensemble wind</th></tr></thead>
          <tbody>${hourScale(day, 1000, 0, 0).hours.map(x => `<tr><td class="l">${fmtHour(x.hour)}</td><td class="l">${esc(x.cond)}</td><td>${Math.round(x.temp)}°</td><td>${Math.round(x.wind)} mph</td><td class="l">${x.dirLabel} (${Math.round(x.dir)}°)</td><td>${Math.round(x.gust)} mph</td><td>${x.precipProb ?? 0}%</td><td class="dim">${x.windP10 !== undefined ? `${Math.round(x.windP10)}–${Math.round(x.windP90)}` : '—'}</td></tr>`).join('')}</tbody>
        </table></div>
      </details>
    </div>`;
  drawWind($('#windChart'), day, wave);
  drawDirStrip($('#dirChart'), day);
  drawCompass($('#compass'), wave);
  drawRain($('#rainChart'), day);
  drawTemp($('#tempChart'), day);
}

// ── Backtest tab ─────────────────────────────────────────────────────────────────────────
function renderBacktest() {
  const el = $('#panel-backtest');
  const st = S.status, bt = S.backtest;
  const statusCard = `<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h2>History data</h2><span class="sub">The model’s round-score history</span></div>
    <div class="card-b">${!st ? '<div class="skel" style="height:40px"></div>' : st.source === 'database'
      ? `<div class="grid-3" style="grid-template-columns:repeat(4,1fr);gap:12px">
          <div><div class="tile lbl" style="padding:0">Rounds stored</div><div style="font-size:18px;font-weight:700">${(st.totals?.rounds || 0).toLocaleString()}</div></div>
          <div><div class="tile lbl" style="padding:0">Players</div><div style="font-size:18px;font-weight:700">${(st.totals?.players || 0).toLocaleString()}</div></div>
          <div><div class="tile lbl" style="padding:0">From</div><div style="font-size:18px;font-weight:700">${st.totals?.first ? String(st.totals.first).slice(0, 10) : '—'}</div></div>
          <div><div class="tile lbl" style="padding:0">To</div><div style="font-size:18px;font-weight:700">${st.totals?.last ? String(st.totals.last).slice(0, 10) : '—'}</div></div>
        </div>
        <p class="note" style="margin-top:12px">${(st.seasons || []).map(s => `${s.tour.toUpperCase()} ${s.season}: ${s.events} events`).join(' · ') || 'No events synced yet.'} New events sync every Monday; backfill with <code>/api/sync?tour=pga&amp;season=2025</code> until <code>remaining</code> is 0.</p>`
      : `<p class="note"><b>Running on the live ESPN fallback.</b> ${esc(st.note || '')}</p>`}
    </div></div>`;

  let body = '';
  if (S.btLoading) body = '<div class="card state"><h3>Running backtest…</h3><p>Rebuilding the model as of each event’s start and simulating it blind. This takes 20–50 seconds.</p></div>';
  else if (S.errors.backtest) body = stateHtml('err', 'Backtest failed', 'The backtest endpoint returned an error.', S.errors.backtest);
  else if (!bt) body = `<div class="card state"><h3>How well does the model predict?</h3><p>For each recent completed event, the model is rebuilt from only the rounds played before it started, simulated without knowing any of its scores, then graded against the real finish.</p><div style="margin-top:16px;display:flex;gap:10px;justify-content:center;align-items:center"><span class="seg-label">Events</span><div class="seg" id="btEvents">${[4, 8, 12].map(n => `<button aria-pressed="${S.btEvents === n}" data-v="${n}">${n}</button>`).join('')}</div><button class="btn primary" id="runBt">${ICON.play} Run backtest</button></div></div>`;
  else {
    const mk = bt.markets.find(m => m.key === S.btMarket) || bt.markets[0];
    body = `
      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h2>Accuracy by market</h2><span class="sub">${bt.eventsScored} events · ${bt.sims.toLocaleString()} sims each · lower Brier and log loss are better</span></div>
        <div class="table-wrap" style="border:0;border-radius:0 0 var(--r) var(--r)"><table class="data">
          <thead><tr><th class="l">Market</th><th>Predictions</th><th>Brier</th><th>No-skill Brier</th><th data-tip="1 − Brier / no-skill Brier. Above 0 means the model beats assigning every player the base rate.">Skill score</th><th>Log loss</th><th>No-skill log loss</th></tr></thead>
          <tbody>${bt.markets.filter(m => m.n).map(m => `<tr><td class="l"><span class="pname">${m.label}</span></td><td>${m.n.toLocaleString()}</td><td>${m.brier.toFixed(4)}</td><td class="dim">${m.brierBase.toFixed(4)}</td><td class="sorted"><span class="tag ${m.skill > 0.02 ? 'pos' : m.skill < 0 ? 'neg' : ''}">${m.skill >= 0 ? '+' : '−'}${Math.abs(m.skill * 100).toFixed(1)}%</span></td><td>${m.logLoss.toFixed(4)}</td><td class="dim">${m.logLossBase.toFixed(4)}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>
      <div class="wx-two" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-bottom:16px">
        <div class="card"><div class="card-h"><h2>Calibration · ${esc(mk.label)}</h2><div class="seg" id="btMarket">${bt.markets.filter(m => m.n).map(m => `<button aria-pressed="${m.key === mk.key}" data-v="${m.key}">${m.label}</button>`).join('')}</div></div>
          <div class="card-b"><div class="chart" id="calChart"></div><p class="note" style="margin-top:8px">Points on the diagonal mean the stated probability came true that often. Thin bins (hover for counts) are noisy, so don’t read much into one point.</p></div></div>
        <div class="card"><div class="card-h"><h2>Calibration table</h2><span class="sub">${esc(mk.label)}</span></div>
          <div class="table-wrap" style="border:0;border-radius:0 0 var(--r) var(--r)"><table class="data"><thead><tr><th class="l">Predicted bin</th><th>Players</th><th>Avg predicted</th><th>Actual</th></tr></thead>
          <tbody>${(mk.bins || []).map(b => `<tr><td class="l">${pct(b.lo, 0)}–${pct(b.hi, 0)}</td><td>${b.n}</td><td>${pct(b.predicted)}</td><td class="sorted">${pct(b.actual)}</td></tr>`).join('')}</tbody></table></div></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Events</h2><button class="btn" id="rerunBt">Run again</button></div>
        <div class="table-wrap" style="border:0;border-radius:0 0 var(--r) var(--r)"><table class="data">
          <thead><tr><th class="l">Event</th><th class="l">Date</th><th>Field</th><th class="l">Winner</th><th>Model win %</th><th data-tip="Where the winner ranked on the model's pre-tournament board">Winner’s rank</th><th class="l">Model favorite</th></tr></thead>
          <tbody>${bt.events.map(e => `<tr><td class="l"><span class="pname">${esc(e.name)}</span></td><td class="l dim">${esc(e.date)}</td><td>${e.field}</td><td class="l">${esc(e.winner || '—')}</td><td>${pct(e.winnerProb)}</td><td>${e.winnerRank ? `#${e.winnerRank}` : '—'}</td><td class="l dim">${esc(e.favorite || '—')} · ${pct(e.favoriteProb)}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>
      <p class="note foot">Backtests don’t apply weather yet (no stored tee times for past events). Win is the hardest market — even a sharp model rarely beats the no-skill score by much there. Top 20 and make-cut are the honest test.</p>`;
  }
  el.innerHTML = statusCard + gradesHtml() + body;
  if (bt && !S.btLoading && $('#calChart')) drawCalibration($('#calChart'), (bt.markets.find(m => m.key === S.btMarket) || bt.markets[0]).bins || []);
}

function gradesHtml() {
  const g = S.grades;
  const head = '<div class="card-h"><h2>Live track record</h2><span class="sub">Each week’s projection locked at the first tee time, graded when the event ends</span></div>';
  if (S.gradesLoading && !g) return `<div class="card" style="margin-bottom:16px">${head}<div class="card-b"><div class="skel" style="height:40px"></div></div></div>`;
  if (S.gradesErr) return `<div class="card" style="margin-bottom:16px">${head}<div class="card-b note" style="color:var(--neg)">${esc(S.gradesErr)}</div></div>`;
  if (!g) return '';
  if (!g.available) return `<div class="card" style="margin-bottom:16px">${head}<div class="card-b note">${esc(g.note)}</div></div>`;
  const pending = g.events.filter(e => e.status === 'pending');
  if (!g.eventsGraded) return `<div class="card" style="margin-bottom:16px">${head}<div class="card-b"><p class="note"><b>Nothing graded yet.</b> The pre-tournament projection is saved on every visit before an event starts, and the last one before the first tee time is graded once the event is final. Events with a saved projection: ${pending.length ? pending.map(e => esc(e.name)).join(', ') : 'none yet — visit the site before next week’s first round'}.</p></div></div>`;
  const tb = g.threeBalls;
  return `<div class="card" style="margin-bottom:16px">${head}
    <div class="stats" style="border-top:0">
      <div><div class="k">Events graded</div><div class="v">${g.eventsGraded}</div></div>
      ${g.markets.filter(m => m.n).map(m => `<div><div class="k">${esc(m.label)} skill</div><div class="v ${m.skill > 0 ? 'edge-pos' : ''}">${m.skill >= 0 ? '+' : '−'}${Math.abs(m.skill * 100).toFixed(1)}%</div></div>`).join('')}
      ${tb ? `<div><div class="k" data-tip="Share of R1/R2 3-balls the model favorite won (dead heats split), vs the share the model expected">3-ball favorites</div><div class="v">${pct(tb.favActual, 0)}<small>exp ${pct(tb.favExpected, 0)}</small></div></div>` : ''}
    </div>
    <div class="table-wrap" style="border:0;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)"><table class="data">
      <thead><tr><th class="l">Event</th><th>Field</th><th class="l">Winner</th><th>Model win %</th><th>Winner’s rank</th><th>Top-20 skill</th><th>3-ball favs</th></tr></thead>
      <tbody>${g.events.map(e => e.status === 'pending' ? `<tr><td class="l"><span class="pname">${esc(e.name)}</span></td><td colspan="6" class="l muted">Projection locked · grades when final</td></tr>` : `<tr><td class="l"><span class="pname">${esc(e.name)}</span><div class="psub">${esc(String(e.date || '').slice(0, 10))}</div></td><td>${e.field}</td><td class="l">${esc(e.winner || '—')}</td><td>${pct(e.winnerProb)}</td><td>${e.winnerRank ? `#${e.winnerRank}` : '—'}</td><td>${e.top20Skill === null ? '—' : `${e.top20Skill >= 0 ? '+' : '−'}${Math.abs(e.top20Skill * 100).toFixed(1)}%`}</td><td>${e.threeBalls?.groups ? `${pct(e.threeBalls.favActual / e.threeBalls.groups, 0)} <span class="muted">/ ${pct(e.threeBalls.favExpected / e.threeBalls.groups, 0)}</span>` : '—'}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
}
async function loadGrades() {
  if (S.gradesLoading) return;
  S.gradesLoading = true; S.gradesErr = null; renderBacktest();
  try { S.grades = await api(`/api/grades?t=${Date.now()}`); } catch (err) { S.gradesErr = err.message; }
  S.gradesLoading = false; renderBacktest();
}

async function runBacktestNow() {
  S.btLoading = true; S.errors.backtest = null; renderBacktest();
  try { S.backtest = await api(`/api/backtest?events=${S.btEvents}&t=${Date.now()}`); }
  catch (err) { S.errors.backtest = err.message; }
  S.btLoading = false; renderBacktest();
}

// ── Wiring ───────────────────────────────────────────────────────────────────────────────
function renderAll() {
  renderHero();
  renderOdds();
  renderMatchups();
  renderDfs();
  renderWeather();
  renderBacktest();
}
function setTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  document.querySelectorAll('.panel').forEach(p => { p.hidden = p.id !== `panel-${tab}`; });
  const u = new URL(location.href); u.searchParams.set('tab', tab); history.replaceState(null, '', u);
  // Charts measure their container, so draw the weather tab once it is visible.
  if (tab === 'weather') renderWeather();
  if (tab === 'backtest') { renderBacktest(); if (!S.grades && !S.gradesLoading) loadGrades(); }
}

document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab); });
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const tabs = [...document.querySelectorAll('.tab')], i = tabs.findIndex(t => t.dataset.tab === S.tab);
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  setTab(next.dataset.tab); next.focus();
});

document.addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('[data-goto]'); if (go) { e.preventDefault(); setTab(go.dataset.goto); scrollTo({ top: 0 }); return; }
  const th = t.closest('th[data-sort]');
  if (th) { const k = th.dataset.sort; S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: k === 'name' || k === 'avgFinish' ? 1 : -1 }; renderOdds(); return; }
  const row = t.closest('tr[data-id]'); if (row) { openDrawer(row.dataset.id); return; }
  const seg = t.closest('.seg button'); if (seg) {
    const id = seg.parentElement.id, v = seg.dataset.v;
    if (id === 'drawSeg') { S.draw = v; renderOdds(); }
    if (id === 'fmtSeg' || id === 'fmtSeg2') { S.fmt = v; renderOdds(); renderMatchups(); }
    if (id === 'roundSeg') { S.mRound = Number(v); S.autoRes = null; renderMatchups(); }
    if (id === 'btMarket') { S.btMarket = v; renderBacktest(); }
    if (id === 'btEvents') { S.btEvents = Number(v); renderBacktest(); }
    if (id === 'dkMode') { S.dkMode = v; S.dkResult = null; renderDfs(); }
    if (id === 'dkDraw') { S.dkDraw = v; renderDfs(); }
    if (id === 'autoSize') { S.autoSize = Number(v); S.autoRes = null; renderMatchups(); }
    return;
  }
  const leg = t.closest('[data-leg]');
  if (leg) { const [r, id] = leg.dataset.leg.split('|'); toggleLeg(Number(r), id); return; }
  const un = t.closest('[data-unleg]'); if (un) { S.slip.splice(Number(un.dataset.unleg), 1); S.parlay = null; renderMatchups(); return; }
  if (t.closest('#priceSlip')) { priceSlip(); return; }
  if (t.closest('#clearSlip')) { S.slip = []; S.parlay = null; S.parlayErr = null; renderMatchups(); return; }
  if (t.closest('#autoBuild')) { autoBuild(); return; }
  const use = t.closest('[data-use]');
  if (use) { const x = S.autoRes.parlays[Number(use.dataset.use)]; S.slip = x.legs.map(l => ({ round: l.round, id: l.id })); S.parlay = x; renderMatchups(); return; }
  const lockB = t.closest('[data-lock]');
  if (lockB) { const id = lockB.dataset.lock; S.dkExcludes.delete(id); S.dkLocks.has(id) ? S.dkLocks.delete(id) : S.dkLocks.add(id); renderDfs(); return; }
  const exB = t.closest('[data-ex]');
  if (exB) { const id = exB.dataset.ex; S.dkLocks.delete(id); S.dkExcludes.has(id) ? S.dkExcludes.delete(id) : S.dkExcludes.add(id); renderDfs(); return; }
  const dkTh = t.closest('th[data-dksort]');
  if (dkTh) { const k = dkTh.dataset.dksort; S.dkSort = S.dkSort.key === k ? { key: k, dir: -S.dkSort.dir } : { key: k, dir: k === 'name' ? 1 : -1 }; renderDfs(); return; }
  if (t.closest('#dkBuild')) { buildDfs(); return; }
  if (t.closest('#dkExport')) { exportDfs(); return; }
  if (t.closest('#dkResetLx')) { e.preventDefault(); S.dkLocks.clear(); S.dkExcludes.clear(); renderDfs(); return; }
  const dayBtn = t.closest('.day[data-day]'); if (dayBtn) { S.wxDay = Number(dayBtn.dataset.day); renderWeather(); return; }
  if (t.closest('#runBt') || t.closest('#rerunBt')) { runBacktestNow(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
  const row = e.target.closest?.('tr[data-id]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(row.dataset.id); }
  const legEl = e.target.closest?.('[data-leg]');
  if (legEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const [r, id] = legEl.dataset.leg.split('|'); toggleLeg(Number(r), id); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; renderOdds(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'dkq') { S.dkQ = e.target.value; const pos = e.target.selectionStart; renderDfs(); const q = $('#dkq'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'mq') { S.mq = e.target.value; const pos = e.target.selectionStart; renderMatchups(); const q = $('#mq'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'marketSel') { S.market = e.target.value; renderOdds(); }
  if (e.target.id === 'dkCount') { S.dkCount = Number(e.target.value); renderDfs(); }
  if (e.target.id === 'dkExposure') { S.dkExposure = Number(e.target.value); renderDfs(); }
  if (e.target.id === 'dkUnique') { S.dkUnique = Number(e.target.value); renderDfs(); }
});
$('#scrim').addEventListener('click', closeDrawer);
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.tab === 'weather') renderWeather(); if (S.tab === 'backtest') renderBacktest(); }, 150); });

$('#tourSelect').value = S.tour;
$('#tourSelect').addEventListener('change', e => { S.tour = e.target.value; S.event = ''; navigate(); });
$('#eventSelect').addEventListener('change', e => { S.event = e.target.value; navigate(); });
$('#refresh').addEventListener('click', () => load(true));
function navigate() {
  const u = new URL(location.href);
  u.searchParams.set('tour', S.tour);
  if (S.event) u.searchParams.set('event', S.event); else u.searchParams.delete('event');
  history.replaceState(null, '', u);
  S.data = S.weather = S.backtest = null; S.book = null; S.mRound = null; S.errors = {};
  S.slip = []; S.parlay = null; S.autoRes = null; S.salaries = null; S.dkResult = null; S.dkLocks = new Set(); S.dkExcludes = new Set();
  renderAll(); load();
}

async function loadEvents() {
  try {
    const { events } = await api('/api/events');
    const now = Date.now();
    const sel = $('#eventSelect');
    sel.innerHTML = '<option value="">Current event</option>' + events.map(e => {
      const past = e.endDate && new Date(e.endDate).getTime() < now;
      return `<option value="${esc(e.id)}" ${e.id === S.event ? 'selected' : ''}>${esc(e.name)}${past ? ' · final' : ''}</option>`;
    }).join('');
  } catch { /* picker stays on "Current event" */ }
}

async function load(force = false) {
  $('#refresh').classList.add('spin');
  const jobs = [
    api('/api/tournament').then(d => { S.data = d; S.errors.tournament = null; }).catch(err => { S.errors.tournament = err.message; }),
    api('/api/weather').then(d => { S.weather = d; S.errors.weather = null; }).catch(err => { S.errors.weather = err.message; }),
    api('/api/status').then(d => { S.status = d; }).catch(() => { S.status = { source: 'unknown', note: 'Status endpoint unavailable.' }; }),
  ];
  await Promise.all(jobs);
  if (S.data && !S.book) {
    try {
      const saved = JSON.parse(localStorage.getItem(`golfprob-book-${S.tour}-${S.data.event.id}`) || 'null');
      if (saved) { S.book = saved; resolveBook(); }
    } catch { /* storage unavailable */ }
  } else if (S.book) resolveBook();
  if (S.data && !S.salaries) {
    try { const saved = JSON.parse(localStorage.getItem(dkKey()) || 'null'); if (saved) S.salaries = saved; } catch { /* storage unavailable */ }
  }
  if (S.salaries) resolveSalaries();
  $('#refresh').classList.remove('spin');
  renderAll();
  if (!S.event && S.data) { const sel = $('#eventSelect'); if ([...sel.options].some(o => o.value === S.data.event.id)) sel.value = S.data.event.id; }
}

setTab(['odds', 'matchups', 'dfs', 'weather', 'backtest'].includes(S.tab) ? S.tab : 'odds');
renderAll();
loadEvents();
load();
</script>
</body>
</html>
